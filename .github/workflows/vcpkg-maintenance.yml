name: vcpkg Maintenance Check

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  vcpkg-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Clone vcpkg
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
          BASELINE=$(jq -r '."builtin-baseline"' dynamic-neural-field-composer/vcpkg.json)
          git -C "$GITHUB_WORKSPACE/vcpkg" fetch --depth=1 origin "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"

      - name: Build version report and create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PACKAGES="imgui implot imgui-node-editor nlohmann-json fftw3 gtest benchmark"
          VCPKG_DIR="$GITHUB_WORKSPACE/vcpkg"
          DATE=$(date +%Y-%m-%d)

          # Ensure the maintenance label exists
          gh label create maintenance \
            --color "#ededed" \
            --description "Routine maintenance tasks" \
            --force 2>/dev/null || true

          # Reads a port's vcpkg.json on stdin; prints version-semver, version-date or version.
          port_version() {
            jq -r '
              if .["version-semver"] then .["version-semver"]
              elif .["version-date"] then .["version-date"]
              elif .version then .version
              else "unknown"
              end'
          }

          # Build a Markdown table of pinned and latest port versions
          TABLE="| Package | Pinned | Latest | Port-version | Notes |\n|---|---|---|---|---|\n"

          for pkg in $PACKAGES; do
            PORT_JSON="$VCPKG_DIR/ports/$pkg/vcpkg.json"
            if [ ! -f "$PORT_JSON" ]; then
              TABLE="${TABLE}| \`$pkg\` | — | not found | — | Port directory missing in cloned vcpkg |\n"
              continue
            fi

            VERSION=$(port_version < "$PORT_JSON")
            PINNED=$(git -C "$VCPKG_DIR" show "$BASELINE:ports/$pkg/vcpkg.json" 2>/dev/null | port_version)
            PINNED=${PINNED:-not found}

            PORT_VERSION=$(jq -r '.["port-version"] // 0' "$PORT_JSON")

            # Flag non-zero port-version (port patch without upstream version change)
            NOTE=""
            if [ "$PORT_VERSION" != "0" ] && [ "$PORT_VERSION" != "null" ]; then
              NOTE="port patch applied (port-version: $PORT_VERSION)"
            fi

            if [ "$PINNED" != "$VERSION" ]; then
              NOTE="${NOTE:+$NOTE; }newer version available"
            fi

            TABLE="${TABLE}| \`$pkg\` | $PINNED | $VERSION | $PORT_VERSION | $NOTE |\n"
          done

          # Compose issue body
          BODY=$(printf "## Monthly vcpkg dependency report — %s\n\n\
          This is an automated monthly check of the vcpkg packages used by **dynamic-neural-field-composer**.\n\
          Every build uses the versions pinned by \`builtin-baseline\` in \`dynamic-neural-field-composer/vcpkg.json\` (vcpkg commit \`%s\`).\n\
          *Pinned* is what that commit provides; *Latest* is what vcpkg HEAD offers today.\n\n\
          ### Package versions\n\n%s\n\
          ### What to look for\n\n\
          - **Non-zero port-version**: the port was patched without an upstream release — usually safe, but worth noting.\n\
          - **Major version bumps**: may introduce breaking API changes. Consider running a manual integration test before the next release.\n\n\
          ### Recommended action\n\n\
          To adopt newer versions, open a PR that sets \`builtin-baseline\` to a newer vcpkg commit and let CI verify it.\n\
          Downstream projects pin their own baseline in their \`vcpkg.json\`; move them together.\n\
          Close this issue once reviewed.\n" "$DATE" "$BASELINE" "$(printf "$TABLE")")

          gh issue create \
            --title "chore: monthly vcpkg dependency report — $DATE" \
            --label "maintenance" \
            --body "$BODY"
