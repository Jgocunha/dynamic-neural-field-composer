name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - build_type: Release
            coverage: false
          - build_type: Debug
            coverage: true

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── System dependencies ────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglfw3-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            gcovr \
            xvfb
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      # ── vcpkg ─────────────────────────────────────────────────────────────
      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT

      - name: Bootstrap vcpkg
        run: $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('dynamic-neural-field-composer/scripts/setup.sh') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # ── Dependencies + build ───────────────────────────────────────────────
      - name: Setup dependencies
        working-directory: ./dynamic-neural-field-composer
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh

      - name: Build
        if: ${{ !matrix.coverage }}
        working-directory: ./dynamic-neural-field-composer
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Configure CMake (coverage)
        if: ${{ matrix.coverage }}
        working-directory: ./dynamic-neural-field-composer
        run: |
          cmake -S . -B build/linux-debug \
                -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/dynamic-neural-field-composer/deps/ipk-install \
                -DCMAKE_CXX_COMPILER=g++-13 \
                -DCMAKE_C_COMPILER=gcc-13 \
                -DCMAKE_CXX_FLAGS=--coverage \
                -DCMAKE_EXE_LINKER_FLAGS=--coverage

      - name: Build (coverage)
        if: ${{ matrix.coverage }}
        working-directory: ./dynamic-neural-field-composer
        run: cmake --build build/linux-debug --parallel $(nproc)

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run tests
        if: ${{ !matrix.coverage }}
        working-directory: ./dynamic-neural-field-composer/build/linux-release
        run: ctest --output-on-failure --parallel $(nproc)

      # ctest (above) runs every gtest case as its own CTest test via
      # gtest_discover_tests, each in a separate process -- so a case that
      # leaks process-global state (e.g. Logger's minimum level) can never
      # affect a later case and this can never fail here. Run the whole
      # binary once in a single process, the way a contributor running
      # `dnf_composer_tests` directly would, so that kind of order
      # dependence has a real chance to fail CI (#161). --gtest_shuffle
      # randomizes case order each run to widen what a single run can catch.
      - name: Run full test suite in a single process (order-dependence check)
        if: ${{ !matrix.coverage }}
        working-directory: ./dynamic-neural-field-composer/build/linux-release
        run: ./tests/dnf_composer_tests --gtest_shuffle

      - name: Run tests (coverage)
        if: ${{ matrix.coverage }}
        working-directory: ./dynamic-neural-field-composer/build/linux-debug
        run: ctest --output-on-failure --parallel $(nproc)

      # ── Example smoke-run (#129) ────────────────────────────────────────────
      # The example_*.cpp GUI examples are compiled but never executed, so a
      # broken example only surfaces when a human happens to run it by hand.
      # Each example's main loop now honors DNFC_EXAMPLE_MAX_STEPS
      # (examples/example_common.h): set, it requests its own shutdown after
      # that many app.step() calls instead of waiting for a window close.
      # xvfb-run supplies the virtual display GLFW/OpenGL need to initialize
      # at all on a headless runner; LIBGL_ALWAYS_SOFTWARE forces Mesa's
      # software (llvmpipe) rasterizer since the runner has no real GPU.
      - name: Smoke-run examples (headless)
        if: ${{ !matrix.coverage }}
        working-directory: ./dynamic-neural-field-composer/build/linux-release/examples
        env:
          DNFC_EXAMPLE_MAX_STEPS: "200"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          shopt -s nullglob
          binaries=(example_*)
          if [ ${#binaries[@]} -eq 0 ]; then
            echo "No example_* binaries found in $(pwd) -- examples/CMakeLists.txt or the build may have changed."
            exit 1
          fi
          fail=0
          for bin in "${binaries[@]}"; do
            [ -x "$bin" ] || continue
            echo "::group::$bin"
            if xvfb-run -a --server-args="-screen 0 1280x1024x24" "./$bin"; then
              echo "OK: $bin"
            else
              echo "FAILED: $bin (exit $?)"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      # ── Coverage report (Debug matrix entry only) ──────────────────────────
      - name: Generate coverage report
        if: matrix.coverage && github.event_name == 'push'
        run: |
          gcovr \
            --root ${{ github.workspace }}/dynamic-neural-field-composer \
            --object-directory ${{ github.workspace }}/dynamic-neural-field-composer/build/linux-debug \
            --gcov-executable gcov-13 \
            --exclude '.*vcpkg.*' \
            --exclude '.*/tests/.*' \
            --exclude '.*/examples/.*' \
            --exclude '.*/imgui-platform-kit.*' \
            --exclude-directories '.*CMakeFiles.*' \
            --gcov-ignore-errors=no_working_dir_found \
            --xml \
            -o coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.coverage && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  sanitizers-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: asan-ubsan
            build_dir: build/linux-asan
            cxx_flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
            linker_flags: "-fsanitize=address,undefined"
          - name: tsan
            build_dir: build/linux-tsan
            cxx_flags: "-fsanitize=thread -fno-omit-frame-pointer -g"
            linker_flags: "-fsanitize=thread"

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── System dependencies ────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglfw3-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      # ── vcpkg ─────────────────────────────────────────────────────────────
      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT

      - name: Bootstrap vcpkg
        run: $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('dynamic-neural-field-composer/scripts/setup.sh') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # ── Dependencies + build ───────────────────────────────────────────────
      - name: Setup dependencies
        working-directory: ./dynamic-neural-field-composer
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh

      - name: Configure CMake (${{ matrix.name }})
        working-directory: ./dynamic-neural-field-composer
        run: |
          cmake -S . -B ${{ matrix.build_dir }} \
                -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/dynamic-neural-field-composer/deps/ipk-install \
                -DCMAKE_CXX_COMPILER=g++-13 \
                -DCMAKE_C_COMPILER=gcc-13 \
                -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
                -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"

      - name: Build (${{ matrix.name }})
        working-directory: ./dynamic-neural-field-composer
        run: cmake --build ${{ matrix.build_dir }} --parallel $(nproc)

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run tests (ASan + UBSan)
        if: matrix.name == 'asan-ubsan'
        working-directory: ./dynamic-neural-field-composer/${{ matrix.build_dir }}
        env:
          # detect_leaks=1: PR #151 severed the Element::inputs/outputs shared_ptr
          # ownership cycle on Simulation teardown, and PR #153 fixed the
          # ImNodeEditor context leak. Leak detection is back on so a new leak
          # outside the known exclusions below can fail this job instead of
          # passing silently. See tests/lsan_suppressions.txt for exactly what
          # is still excluded and why (the cycle is not fully closed -- only
          # for Simulation-owned elements -- plus a well-known FFTW3 false
          # positive).
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/dynamic-neural-field-composer/tests/lsan_suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --output-on-failure --parallel $(nproc)

      - name: Run tests (TSan)
        if: matrix.name == 'tsan'
        working-directory: ./dynamic-neural-field-composer/${{ matrix.build_dir }}
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --output-on-failure --parallel $(nproc)

  build-and-test-windows:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Normalize Windows paths for bash ──────────────────────────────────
      - name: Normalize paths
        run: |
          echo "VCPKG_ROOT=$(echo "$VCPKG_ROOT" | tr '\\' '/')" >> "$GITHUB_ENV"

      # ── vcpkg ─────────────────────────────────────────────────────────────
      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT

      - name: Bootstrap vcpkg
        run: $VCPKG_ROOT/bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('dynamic-neural-field-composer/scripts/setup.bat') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # ── Dependencies + build ───────────────────────────────────────────────
      - name: Setup dependencies
        working-directory: ./dynamic-neural-field-composer
        shell: cmd
        run: scripts\setup.bat

      - name: Build
        working-directory: ./dynamic-neural-field-composer
        shell: cmd
        run: scripts\build.bat

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run tests
        working-directory: ./dynamic-neural-field-composer/build/x64-release
        shell: cmd
        run: |
          set "PATH=C:\Program Files\CMake\bin;%VCPKG_ROOT%/installed/x64-windows/bin;%PATH%"
          ctest -C Release --output-on-failure --parallel

  build-and-test-macos:
    runs-on: macos-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Detect architecture and set vcpkg triplet ──────────────────────────
      - name: Set vcpkg triplet
        id: triplet
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            echo "VCPKG_DEFAULT_TRIPLET=arm64-osx" >> "$GITHUB_ENV"
            echo "vcpkg_triplet=arm64-osx" >> "$GITHUB_OUTPUT"
          else
            echo "VCPKG_DEFAULT_TRIPLET=x64-osx" >> "$GITHUB_ENV"
            echo "vcpkg_triplet=x64-osx" >> "$GITHUB_OUTPUT"
          fi

      # ── vcpkg ─────────────────────────────────────────────────────────────
      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT

      - name: Bootstrap vcpkg
        run: $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ runner.os }}-${{ steps.triplet.outputs.vcpkg_triplet }}-${{ hashFiles('dynamic-neural-field-composer/scripts/setup.sh') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ steps.triplet.outputs.vcpkg_triplet }}-

      # ── Dependencies + build ───────────────────────────────────────────────
      - name: Setup dependencies
        working-directory: ./dynamic-neural-field-composer
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh

      - name: Build
        working-directory: ./dynamic-neural-field-composer
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      # ── Tests ──────────────────────────────────────────────────────────────
      - name: Run tests
        working-directory: ./dynamic-neural-field-composer/build/macos-release
        run: ctest --output-on-failure --parallel $(sysctl -n hw.logicalcpu)
