name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repository (checkout) and reads/writes the vcpkg Actions cache --
# neither needs more than read access to repository contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04

    # run-clang-tidy over the whole src/ tree is the dominant cost of this job (~8 of
    # ~9 minutes). Every file is still analysed exactly once per push/PR -- shard just
    # splits the same file list 3 ways so the shards run in parallel instead of serially.
    strategy:
      matrix:
        shard: [0, 1, 2]
      fail-fast: false

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy cmake \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev pkg-config \
            autoconf-archive

      - name: Set up vcpkg
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure
        run: |
          cmake -S ./dynamic-neural-field-composer -B build \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.vcpkg.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-key-prefix }}${{ hashFiles('vcpkg-binary-cache/**') }}

      - name: Run clang-tidy (shard ${{ matrix.shard }}/3)
        run: |
          mapfile -t files < <(
            find dynamic-neural-field-composer/src -name '*.cpp' \
              ! -path '*/user_interface/fonts/*' ! -path '*/user_interface/node_utilities/*' \
              | sort
          )
          shard_files=()
          shard="${{ matrix.shard }}"
          for i in "${!files[@]}"; do
            if [ "$((i % 3))" -eq "$shard" ]; then
              shard_files+=("${files[$i]}")
            fi
          done
          echo "Linting ${#shard_files[@]} of ${#files[@]} files in this shard"
          run-clang-tidy -p build \
            -header-filter='dynamic-neural-field-composer/include/((application|element_parameters|elements|exceptions|simulation|tools|visualization)/.*|user_interface/[^/]+)$' \
            "${shard_files[@]}"
